<!--
  Load Fraunces + Open Sans for Storybook previews.
  The live Next.js app uses next/font (self-hosted, GDPR-safe). Storybook's
  Vite build can't reach Google Fonts from the CI sandbox, so we load them
  at runtime from the browser — the user's machine has internet access.
  The CSS variables below mirror what next/font sets in the real app.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Open+Sans:wght@400;500;600;700&display=swap"
/>
<style>
  :root {
    --font-fraunces: "Fraunces", Georgia, serif;
    --font-open-sans: "Open Sans", system-ui, -apple-system, sans-serif;
  }
</style>
